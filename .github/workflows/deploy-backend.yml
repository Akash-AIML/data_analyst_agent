name: Deploy Backend → Azure Container Apps

on:
  push:
    branches: [main, "member3/insight-report-agent"]
    paths:
      - "**.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:       # allow manual trigger from GitHub UI

env:
  RESOURCE_GROUP: ai-data-analyst-rg
  LOCATION: eastus
  ACR_NAME: aidataanalystacr            # change if taken — must be globally unique
  APP_ENV_NAME: ai-data-analyst-env
  APP_NAME: ai-data-analyst-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # needed for Azure OIDC login (optional — see Step 1 note)
      contents: read

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Azure login ───────────────────────────────────────────
      # Option A: Service Principal (simpler, works everywhere)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          # AZURE_CREDENTIALS is a JSON blob:
          # {
          #   "clientId":       "<sp-app-id>",
          #   "clientSecret":   "<sp-password>",
          #   "subscriptionId": "<subscription-id>",
          #   "tenantId":       "<tenant-id>"
          # }
          # Create with: az ad sp create-for-rbac --name "ai-data-analyst-sp"
          #              --role contributor --sdk-auth --scopes /subscriptions/<id>

      # ── 3. Ensure resource group exists ──────────────────────────
      - name: Ensure Resource Group
        run: |
          az group create \
            --name $RESOURCE_GROUP \
            --location $LOCATION \
            --output none

      # ── 4. Ensure ACR exists ─────────────────────────────────────
      - name: Ensure ACR
        run: |
          az acr create \
            --resource-group $RESOURCE_GROUP \
            --name $ACR_NAME \
            --sku Basic \
            --admin-enabled true \
            --output none 2>/dev/null || true

      # ── 5. Build & push to ACR ───────────────────────────────────
      - name: Build & Push Docker Image
        run: |
          az acr build \
            --registry $ACR_NAME \
            --image "$APP_NAME:$IMAGE_TAG" \
            --image "$APP_NAME:latest" \
            --file Dockerfile \
            . \
            --output none

      # ── 6. Ensure Container Apps Environment ─────────────────────
      - name: Ensure Container Apps Environment
        run: |
          az containerapp env create \
            --name $APP_ENV_NAME \
            --resource-group $RESOURCE_GROUP \
            --location $LOCATION \
            --output none 2>/dev/null || true

      # ── 7. Deploy Container App ───────────────────────────────────
      - name: Deploy Container App
        run: |
          ACR_SERVER="${ACR_NAME}.azurecr.io"
          IMAGE_FULL="${ACR_SERVER}/${APP_NAME}:${IMAGE_TAG}"

          ACR_CREDS=$(az acr credential show --name "$ACR_NAME" --output json)
          ACR_USER=$(echo "$ACR_CREDS" | python3 -c "import sys,json; print(json.load(sys.stdin)['username'])")
          ACR_PASS=$(echo "$ACR_CREDS" | python3 -c "import sys,json; print(json.load(sys.stdin)['passwords'][0]['value'])")

          if az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
            # Update existing app
            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE_FULL" \
              --output none
          else
            # Create new app
            az containerapp create \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$APP_ENV_NAME" \
              --image "$IMAGE_FULL" \
              --registry-server "$ACR_SERVER" \
              --registry-username "$ACR_USER" \
              --registry-password "$ACR_PASS" \
              --target-port 8000 \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 3 \
              --cpu 1.0 \
              --memory 2.0Gi \
              --env-vars \
                "OPENAI_API_KEY=secretref:openai-api-key" \
                "OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}" \
                "MODEL=${{ secrets.MODEL }}" \
                "GROQ_API_KEY=secretref:groq-api-key" \
                "ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}" \
                "LLM_BUDGET_US=5.0" \
                "LLM_MIN_INTERVAL_S=0.5" \
                "ENABLE_PDF=0" \
                "OUTPUT_ROOT=/app/output" \
                "UPLOAD_DIR=/app/uploads" \
              --secrets \
                "openai-api-key=${{ secrets.OPENAI_API_KEY }}" \
                "groq-api-key=${{ secrets.GROQ_API_KEY }}" \
              --output none
          fi

      # ── 8. Print deployed URL ─────────────────────────────────────
      - name: Get App URL
        run: |
          URL=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo "✅ Deployed: https://${URL}"
          echo "APP_URL=https://${URL}" >> $GITHUB_STEP_SUMMARY
