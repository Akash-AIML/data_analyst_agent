name: Deploy Backend → Azure Container Apps

on:
  push:
    branches: [main, "member3/insight-report-agent"]
    paths:
      - "**.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  RESOURCE_GROUP: ai-data-analyst-rg
  LOCATION: centralindia
  ACR_NAME: aidataanalystacr
  APP_ENV_NAME: ai-data-analyst-env
  APP_NAME: ai-data-analyst-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Install Container Apps CLI extension ──────────────────
      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade --yes

      # ── 3. Azure Login ───────────────────────────────────────────
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── 4. Create Resource Group ─────────────────────────────────
      - name: Create Resource Group
        run: |
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --output none
          echo "✓ Resource group: $RESOURCE_GROUP"

      # ── 5. Create ACR (skip if exists) ───────────────────────────
      - name: Create ACR
        run: |
          if az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
            echo "✓ ACR already exists: $ACR_NAME"
          else
            az acr create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$ACR_NAME" \
              --sku Basic \
              --admin-enabled true \
              --output none
            echo "✓ ACR created: $ACR_NAME"
          fi

      # ── 6. Build & Push Docker Image (using runner Docker daemon) ─
      - name: Build & Push Docker Image
        run: |
          ACR_SERVER="${ACR_NAME}.azurecr.io"

          # Get ACR credentials
          ACR_CREDS=$(az acr credential show --name "$ACR_NAME" --output json)
          ACR_USER=$(echo "$ACR_CREDS" | python3 -c "import sys,json; print(json.load(sys.stdin)['username'])")
          ACR_PASS=$(echo "$ACR_CREDS" | python3 -c "import sys,json; print(json.load(sys.stdin)['passwords'][0]['value'])")

          # Login to ACR with docker
          echo "$ACR_PASS" | docker login "$ACR_SERVER" --username "$ACR_USER" --password-stdin

          # Build image locally on the runner
          docker build \
            --tag "${ACR_SERVER}/${APP_NAME}:${IMAGE_TAG}" \
            --tag "${ACR_SERVER}/${APP_NAME}:latest" \
            --file Dockerfile \
            .

          # Push both tags
          docker push "${ACR_SERVER}/${APP_NAME}:${IMAGE_TAG}"
          docker push "${ACR_SERVER}/${APP_NAME}:latest"
          echo "✓ Image pushed: ${ACR_SERVER}/${APP_NAME}:${IMAGE_TAG}"

      # ── 7. Create Container Apps Environment (skip if exists) ────
      - name: Create Container Apps Environment
        run: |
          if az containerapp env show --name "$APP_ENV_NAME" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
            echo "✓ Environment already exists: $APP_ENV_NAME"
          else
            az containerapp env create \
              --name "$APP_ENV_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --location "$LOCATION" \
              --output none
            echo "✓ Environment created: $APP_ENV_NAME"
          fi

      # ── 8. Deploy or Update Container App ────────────────────────
      - name: Deploy Container App
        env:
          OPENAI_API_KEY:   ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL:  ${{ secrets.OPENAI_BASE_URL }}
          SELECTED_MODEL:   ${{ secrets.MODEL }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          ALLOWED_ORIGINS:  ${{ secrets.ALLOWED_ORIGINS }}
          LANGSMITH_KEY:    ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          ACR_SERVER="${ACR_NAME}.azurecr.io"
          IMAGE_FULL="${ACR_SERVER}/${APP_NAME}:${IMAGE_TAG}"

          ACR_CREDS=$(az acr credential show --name "$ACR_NAME" --output json)
          ACR_USER=$(echo "$ACR_CREDS" | python3 -c "import sys,json; print(json.load(sys.stdin)['username'])")
          ACR_PASS=$(echo "$ACR_CREDS" | python3 -c "import sys,json; print(json.load(sys.stdin)['passwords'][0]['value'])")

          if az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
            echo "Updating existing Container App image..."
            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE_FULL" \
              --output none
            echo "✓ Image updated to $IMAGE_FULL"
          else
            echo "Creating new Container App..."
            az containerapp create \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$APP_ENV_NAME" \
              --image "$IMAGE_FULL" \
              --registry-server "$ACR_SERVER" \
              --registry-username "$ACR_USER" \
              --registry-password "$ACR_PASS" \
              --target-port 8000 \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 3 \
              --cpu 1.0 \
              --memory 2.0Gi \
              --secrets \
                "openai-api-key=${OPENAI_API_KEY}" \
                "groq-api-key=${GROQ_API_KEY}" \
                "langsmith-api-key=${LANGSMITH_KEY}" \
              --env-vars \
                "OPENAI_API_KEY=secretref:openai-api-key" \
                "OPENAI_BASE_URL=${OPENAI_BASE_URL}" \
                "MODEL=${SELECTED_MODEL}" \
                "GROQ_API_KEY=secretref:groq-api-key" \
                "ALLOWED_ORIGINS=${ALLOWED_ORIGINS}" \
                "LANGSMITH_TRACING_V2=true" \
                "LANGSMITH_API_KEY=secretref:langsmith-api-key" \
                "LANGSMITH_PROJECT=ai-data-analyst" \
                "LLM_BUDGET_US=5.0" \
                "LLM_MIN_INTERVAL_S=0.5" \
                "ENABLE_PDF=0" \
                "OUTPUT_ROOT=/app/output" \
                "UPLOAD_DIR=/app/uploads" \
              --output none
            echo "✓ Container App created"
          fi

      # ── 9. Print deployed URL ─────────────────────────────────────
      - name: Get Deployed URL
        run: |
          URL=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo "✅ API live at: https://${URL}"
          echo "## ✅ Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** https://${URL}" >> $GITHUB_STEP_SUMMARY
          echo "**Health:** https://${URL}/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Set this in Vercel: \`VITE_API_BASE_URL=https://${URL}\`" >> $GITHUB_STEP_SUMMARY
